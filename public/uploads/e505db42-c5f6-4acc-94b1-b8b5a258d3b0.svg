<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="800" fill="url(#bg)" rx="20"/>

  <!-- 装饰圆 -->
  <circle cx="650" cy="150" r="120" fill="rgba(37,99,235,0.1)"/>
  <circle cx="150" cy="650" r="100" fill="rgba(37,99,235,0.08)"/>

  <!-- 电力设备图标 -->
  <g transform="translate(400, 350)">
    <!-- 闪电符号 -->
    <path d="M-30,-60 L10,-10 L-15,-10 L30,60 L-10,10 L15,10 Z" fill="url(#accent)" opacity="0.9"/>

    <!-- 圆形背景 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- 文字 -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e40af">
    玺铭电力
  </text>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3b82f6">
    专业电力设备运维服务商
  </text>

  <!-- 装饰线条 -->
  <line x1="300" y1="620" x2="500" y2="620" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
</svg>
