<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰元素 -->
  <circle cx="600" cy="315" r="200" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="2"/>
  <circle cx="600" cy="315" r="150" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>

  <!-- 闪电符号 -->
  <g transform="translate(570, 250)">
    <path d="M30,0 L0,60 L20,60 L-10,120 L50,50 L30,50 L60,0 Z" fill="rgba(59,130,246,0.3)"/>
  </g>

  <!-- 公司名称 -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
